name: block_survey
description: GPS-based apartment block survey application with Firebase.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: 6.7.1
  firebase_auth: 6.5.6
  firebase_core: 4.12.1
  firebase_storage: 13.4.5
  geolocator: 14.0.3
  google_maps_flutter: 2.18.0
  image_picker: 1.2.3
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
